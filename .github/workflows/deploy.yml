name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Pages 🔧
        uses: actions/configure-pages@v5

      - name: Build Games 🎮
        run: |
          mkdir -p ana-sayfa/public
          games=("bio-triz-arena" "biyoatlas" "celiski-makinesi" "eko-cizgi-roman" "eko-kacis" "eko-sorusturma" "evrim-lab" "fono-komitesi")
          for game in "${games[@]}"; do
            echo ">>> Building $game..."
            if [ -d "$game" ]; then
              cd "$game"
              if [ -f "pnpm-lock.yaml" ]; then
                echo "Detected pnpm project"
                npx pnpm install --frozen-lockfile
                npx pnpm run build
              elif [ -f "package-lock.json" ]; then
                echo "Detected npm project with lockfile"
                npm ci --legacy-peer-deps
                npm run build
              else
                echo "Detected npm project without lockfile"
                npm install --legacy-peer-deps --no-audit
                npm run build
              fi
              mkdir -p ../ana-sayfa/public/$game
              cp -r dist/* ../ana-sayfa/public/$game/
              cd ..
            fi
          done

      - name: Build Main Portal 🚀
        run: |
          cd ana-sayfa
          npm ci --legacy-peer-deps
          npm run build
          cd ..

      - name: Upload artifact 📤
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'ana-sayfa/dist'

      - name: Deploy to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v4
